<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · Software Engineer{% endif %}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <meta name="author" content="{{ site.author }}">
  {% feed_meta %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}profile{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.summary | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.avatar }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5eff'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='system-ui,sans-serif' font-size='30' font-weight='700' fill='white'%3EAN%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="container{% if page.wide %} wide{% endif %}">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}"><span class="mark" aria-hidden="true">AN</span>{{ site.author }}</a>
      <nav class="site-nav" aria-label="Site">
        <a href="{{ '/#blogs' | relative_url }}">Blogs</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/resume/' | relative_url }}">Resume</a>
        <a href="https://github.com/{{ site.github_username }}" rel="me">{% include icons.html name="github" %}<span class="label">GitHub</span></a>
        <a href="{{ site.linkedin_url }}" rel="me">{% include icons.html name="linkedin" %}<span class="label">LinkedIn</span></a>
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch between light and dark mode" title="Switch theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </header>

    {{ content }}

    <footer class="site-footer">
      <span>&copy; {{ 'now' | date: '%Y' }} {{ site.author }} <span aria-hidden="true">·</span> <a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
      <span>Built with <a href="https://jekyllrb.com">Jekyll</a> on <a href="https://pages.github.com">GitHub Pages</a></span>
    </footer>
  </div>
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var current = root.getAttribute("data-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
