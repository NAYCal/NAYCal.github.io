---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time> &middot; {% include reading-time.html content=content %}{% if page.source_url %} &middot; Originally published on <a href="{{ page.source_url }}" rel="noopener">{{ page.source_name | default: "another site" }}</a>{% endif %}</p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
