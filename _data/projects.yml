# Add a project by appending an entry. Newest or most important first.
- title: "Neural Radiance Fields (NeRF)"
  context: "UC Berkeley CS 180, Fall 2023"
  summary: "Fit a neural field to 2D images with sinusoidal positional encoding, then trained a full NeRF from multi-view calibrated images of the Lego scene. Implemented ray generation, stratified sampling along rays, and a PyTorch volume renderer to synthesize novel views."
  tech: [Python, PyTorch, Jupyter]
  image: /assets/img/nerf-lego-render.jpg
  image_alt: "Novel view of a Lego bulldozer rendered by the trained NeRF"
  links:
    - label: "Code on GitHub"
      url: "https://github.com/NAYCal/Neural-Radiance-Field-"

