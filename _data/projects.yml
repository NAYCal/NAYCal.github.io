- title: "BigPixels"
  context: "Personal project, Dec 2023 to Jan 2024"
  summary: "A Python library for computer vision and computational photography with matching NumPy and PyTorch implementations. Includes Gaussian and Laplacian stacks, hybrid images, multi-resolution blending, sharpening and edge detection, plus a glass-plate image colorizer using pyramid alignment."
